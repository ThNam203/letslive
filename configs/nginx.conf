#### nginx proxy settings: public traffic goes through nginx to the Envoy gateway on :8000

location /ws {
	proxy_pass http://localhost:8000;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
}

# Live HLS: every viewer of a stream asks for the same part or blocking
# playlist at about the same moment. proxy_cache_lock sends one of those
# requests to the transcode service and answers the rest from the cache. The
# key includes the Origin because Envoy echoes it in Access-Control-Allow-Origin.
# Needs nginx-http.conf in the http block.
location /transcode/ {
	proxy_pass http://localhost:8000;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Host $host;
	proxy_set_header X-NginX-Proxy true;

	# Parts, segments and init files: cached as long as gohlslib's
	# Cache-Control allows (an hour); errors are not cached.
	proxy_cache letslive_hls;
	proxy_cache_key $scheme$host$request_uri$http_origin;
	proxy_cache_lock on;
	proxy_cache_lock_timeout 10s;
	proxy_cache_lock_age 10s;
	add_header X-Cache-Status $upstream_cache_status always;
}

# Playlists. A blocking request names the part it waits for, so its answer
# can be shared for a second; gohlslib marks it no-cache, hence the override.
location ~ ^/transcode/.+\.m3u8$ {
	proxy_pass http://localhost:8000;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Host $host;
	proxy_set_header X-NginX-Proxy true;

	proxy_cache letslive_hls;
	proxy_cache_key $scheme$host$request_uri$http_origin;
	proxy_cache_lock on;
	proxy_cache_lock_timeout 10s;
	proxy_cache_lock_age 10s;
	proxy_ignore_headers Cache-Control Expires;
	proxy_cache_valid 200 1s;
	proxy_cache_bypass $letslive_hls_skip_playlist_cache;
	proxy_no_cache $letslive_hls_skip_playlist_cache;
	add_header X-Cache-Status $upstream_cache_status always;
}

location / {
	proxy_pass http://localhost:8000/;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Host $host;
	proxy_set_header X-NginX-Proxy true;
}

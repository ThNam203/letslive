                  idle_timeout: 60s
                  regex_rewrite:
                    pattern:
                      regex: ^/
                    substitution: /v1/
                  retry_policy:
                    retry_on: connect-failure,refused-stream
                    num_retries: 3
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: gateway_rate_limit
                    token_bucket:
                      max_tokens: 1000000
                      tokens_per_fill: 1000000
                      fill_interval: 1s
                    filter_enabled:
                      runtime_key: local_rate_limit_enabled
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    filter_enforced:
                      runtime_key: local_rate_limit_enforced
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    max_dynamic_descriptors: 10000
                    rate_limits:
                    - actions:
                      - remote_address: {}
                    descriptors:
                    - entries:
                      - key: remote_address
                      token_bucket:
                        max_tokens: 123
                        tokens_per_fill: 123
                        fill_interval: 60s
              - match:
                  path_separated_prefix: /auth
                route:

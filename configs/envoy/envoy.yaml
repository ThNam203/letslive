# API gateway: routing, CORS, rate limiting and JWT checks in front of the services.
#
# Access tokens are ES256 and verified here against the auth service's JWKS;
# the services verify them again themselves, so a route listed without a JWT
# requirement is still protected by the service when it needs a user.
# Upstream names resolve through Consul DNS (see the resolvers per cluster).
# Check changes with: envoy --mode validate -c configs/envoy/envoy.yaml
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  - name: gateway
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          codec_type: AUTO
          use_remote_address: true
          xff_num_trusted_hops: 1
          generate_request_id: true
          always_set_request_id_in_response: true
          upgrade_configs:
          - upgrade_type: websocket
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: '[%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE%
                    %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%ms "%REQ(X-FORWARDED-FOR)%" %REQ(X-REQUEST-ID)%
                    %UPSTREAM_CLUSTER%

                    '
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel_collector
                  timeout: 1s
                service_name: envoy-gateway
            random_sampling:
              value: 100
          local_reply_config:
            mappers:
            - filter:
                status_code_filter:
                  comparison:
                    op: EQ
                    value:
                      default_value: 401
                      runtime_key: gateway.unauthorized_status
              body_format_override:
                json_format:
                  success: false
                  code: 20005
                  key: res_err_unauthorized
                  message: Unauthorized.
                content_type: application/json
          http_filters:
          - name: envoy.filters.http.cors
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.jwt_authn
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              bypass_cors_preflight: true
              providers:
                access_token:
                  from_cookies:
                  - ACCESS_TOKEN
                  forward: true
                  remote_jwks:
                    http_uri:
                      uri: http://auth.service.consul:7777/v1/.well-known/jwks.json
                      cluster: auth
                      timeout: 5s
                    cache_duration: 300s
                    async_fetch:
                      fast_listener: true
                    retry_policy:
                      num_retries: 5
              requirement_map:
                access_token_required:
                  provider_name: access_token
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: 'function envoy_on_request(handle) end

                  '
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: gateway_rate_limit
              token_bucket:
                max_tokens: 1000000
                tokens_per_fill: 1000000
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              max_dynamic_descriptors: 10000
              rate_limits:
              - actions:
                - remote_address: {}
              descriptors:
              - entries:
                - key: remote_address
                token_bucket:
                  max_tokens: 100
                  tokens_per_fill: 100
                  fill_interval: 1s
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: gateway
            virtual_hosts:
            - name: all
              domains:
              - '*'
              typed_per_filter_config:
                envoy.filters.http.cors:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - safe_regex:
                      regex: .*
                  allow_methods: GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS
                  allow_headers: Content-Type,Authorization,Cache,Accept,Cache-Control,X-Requested-With,Set-Cookie
                  expose_headers: Sec-WebSocket-Accept,Upgrade,Connection
                  max_age: '3600'
                  allow_credentials: true
              routes:
              - match:
                  path_separated_prefix: /realtime
                route:
                  cluster: realtime
                  auto_host_rewrite: true
                  timeout: 0s
                  idle_timeout: 3600s
                  upgrade_configs:
                  - upgrade_type: websocket

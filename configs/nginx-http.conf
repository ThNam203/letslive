#### nginx http-context settings for the live HLS cache.
#### Include this file inside the `http { }` block of the host nginx; the
#### `/transcode/` locations in nginx.conf use the cache zone defined here.

# Parts, segments and blocking playlist responses of live streams. Entries live
# seconds to an hour (upstream Cache-Control), so the zone stays small.
proxy_cache_path /var/cache/nginx/letslive_hls levels=1:2 keys_zone=letslive_hls:10m
                 max_size=1g inactive=10m use_temp_path=off;

# Only LL-HLS blocking playlist requests (they carry _HLS_msn) are cached;
# every other playlist request (master, plain reload, VOD) goes to the gateway.
map $arg__HLS_msn $letslive_hls_skip_playlist_cache {
	""      1;
	default 0;
}

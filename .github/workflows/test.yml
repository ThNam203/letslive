name: test

# tests are not run automatically in CI for now
on:
  workflow_dispatch:

jobs:
  test-go-services:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth, transcode, livestream, user, finance, vod, realtime, chat] # list of go services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: backend/${{ matrix.service }}/go.mod

      - name: Install dependencies
        run: go mod tidy
        working-directory: backend/${{ matrix.service }}

      - name: Run tests
        run: go test -v ./...
        working-directory: backend/${{ matrix.service }}

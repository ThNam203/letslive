name: mobile

on:
  push:
    paths:
      - "mobile/**"
      - "web/lib/i18n/locales/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "web/lib/i18n/locales/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same SDK as mobile-release.yml (FLUTTER_VERSION there).
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check locales are in sync with web
        run: dart run tool/sync_locales.dart --check

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test tool contract_test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

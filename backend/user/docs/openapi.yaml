openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: API documentation for the User Service

servers:
  - url: /api/v1
    description: API v1

components:
  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 500
        message:
          type: string
          example: "internal server error"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        phoneNumber:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        profilePicture:
          type: string
          nullable: true
        backgroundPicture:
          type: string
          nullable: true
        followerCount:
          type: integer
          nullable: true
        isFollowing:
          type: boolean
          nullable: true
        livestreamInformation:
          type: object
          properties:
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            thumbnailUrl:
              type: string
              nullable: true

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - authProvider
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 50
        email:
          type: string
          format: email
        isVerified:
          type: boolean
        authProvider:
          type: string
          enum: [google, local]

    UpdateUserRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 6
          maxLength: 20
        isActive:
          type: boolean
        phoneNumber:
          type: string
        bio:
          type: string
        displayName:
          type: string
          minLength: 6
          maxLength: 20

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /users:
    get:
      summary: Get all users
      operationId: getAllUsers
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/search:
    get:
      summary: Search users by username
      operationId: searchUsers
      description: Results are ordered by username similarity. The response meta carries page and page_size (no total).
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Values outside 1..20 are clamped into that range.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: List of matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    get:
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update current user
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me/profile-picture:
    put:
      summary: Update user profile picture
      description: |
        Expects the avatar already cropped by the client: JPEG or WebP up
        to 10 MiB, both sides between 80 and 2048 pixels. The upload is kept
        unchanged in the private profile-pictures-original bucket; the
        returned URL points to an 80x80 WebP of its center square in the
        public profile-pictures bucket.
      operationId: updateProfilePicture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profile-picture:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile picture updated successfully
          content:
            text/plain:
              schema:
                type: string
                example: "https://storage.example.com/profile-pictures/0b9e6c1e-2f7a-4d8e-9a51-3c0f6d2b7e41.webp"
        "400":
          description: Invalid payload (res_err_invalid_payload), unsupported image (res_err_invalid_image) or dimensions outside 80-2048 px (res_err_image_dimensions_out_of_range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File larger than 10 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me/background-picture:
    put:
      summary: Update user background picture
      operationId: updateBackgroundPicture
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                background-picture:
                  type: string
                  format: binary
      responses:
        "200":
          description: Background picture updated successfully
          content:
            text/plain:
              schema:
                type: string
                example: "/path/to/background-picture.jpg"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me/stream-key:
    put:
      summary: Generate new stream API key
      operationId: generateStreamKey
      security:
        - BearerAuth: []
      responses:
        "200":
          description: New stream key generated
          content:
            text/plain:
              schema:
                type: string
                example: "new-stream-key"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/follow:
    post:
      summary: Follow a user
      operationId: followUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Successfully followed user
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Unfollow a user
      operationId: unfollowUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully unfollowed user
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me/livestream:
    put:
      summary: Update livestream information
      operationId: updateLivestreamInfo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                thumbnail:
                  type: string
                  format: binary
                thumbnailUrl:
                  type: string
      responses:
        "200":
          description: Livestream information updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  thumbnailUrl:
                    type: string
                    nullable: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/push:
    post:
      summary: "INTERNAL: push a message to users' devices"
      description: >
        Internal only (called by the chat service for direct messages); envoy
        has no route for it. Delivery is best-effort and asynchronous: users
        with a live realtime connection are skipped and nothing is stored as a
        notification. Returns 200 once the payload is accepted.
      operationId: sendPushInternal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, title, body, data]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                title:
                  type: string
                  maxLength: 100
                body:
                  type: string
                  maxLength: 500
                data:
                  type: object
                  description: Deep-link data. No other keys are accepted.
                  required: [type]
                  properties:
                    type:
                      type: string
                      maxLength: 50
                      example: dm
                    referenceId:
                      type: string
                      maxLength: 100
                    actionUrl:
                      type: string
                      maxLength: 2048
                      example: /messages/65f0c0ffee
      responses:
        "200":
          description: Accepted
        "400":
          description: Invalid payload or unknown data key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/me/devices:
    post:
      summary: Register a push-notification device token
      description: >
        Upserts by token. A token already registered to another user is
        reassigned to the caller, and its platform, locale and last-seen time
        are refreshed.
      operationId: registerDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                platform:
                  type: string
                  enum: [ios, android]
                locale:
                  type: string
                  maxLength: 35
                  description: Optional BCP 47 language tag, for example vi or en-US
      responses:
        "200":
          description: Token registered; data holds the stored device token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      userId:
                        type: string
                        format: uuid
                      token:
                        type: string
                      platform:
                        type: string
                        enum: [ios, android]
                      locale:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                      lastSeenAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid payload (empty token, unknown platform, bad locale)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/me/devices/{token}:
    delete:
      summary: Unregister a push-notification device token
      description: >
        Deletes the token only when it belongs to the caller. A missing token or
        one owned by another user is a no-op success, so existence never leaks.
      operationId: unregisterDevice
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Token removed or nothing to remove
        "400":
          description: Token empty or longer than 4096 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

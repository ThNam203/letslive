include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  errors:
    avoid_dynamic_calls: error

linter:
  rules:
    - avoid_dynamic_calls
    - always_use_package_imports
    - prefer_final_locals
    - unawaited_futures
    - require_trailing_commas
